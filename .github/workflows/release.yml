name: Build and publish extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package extension
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r '.version' twitch-fs-chat/manifest.json)"
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi
          mkdir -p dist
          (cd twitch-fs-chat && zip -r "../dist/twitch-full-chat-v${VERSION}.zip" .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/twitch-full-chat-${GITHUB_REF_NAME}.zip" \
            --title "Twitch Full Chat ${GITHUB_REF_NAME#v}" \
            --generate-notes
