<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Fullscreen chat</h1>

  <div class="row">
    <span>Chat side</span>
    <div class="seg">
      <label><input type="radio" name="side" value="left"><span>Left</span></label>
      <label><input type="radio" name="side" value="right"><span>Right</span></label>
    </div>
  </div>

  <div class="row">
    <span>Background</span>
    <label class="switch">
      <input type="checkbox" id="background">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span>Old School RuneScape theme</span>
    <label class="switch">
      <input type="checkbox" id="osrsTheme">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row col">
    <div class="rowhead"><span>Distance from bottom</span><span id="bottomVal"></span></div>
    <input type="range" id="bottom" min="0" max="200" step="2">
  </div>

  <div class="row col">
    <div class="rowhead"><span>Messages shown at once</span><span id="maxVal"></span></div>
    <input type="range" id="maxMessages" min="1" max="20" step="1">
  </div>

  <div class="row">
    <span>Show under player controls</span>
    <label class="switch">
      <input type="checkbox" id="underControls">
      <span class="slider"></span>
    </label>
  </div>

  <p class="hint">Fullscreen shortcuts: <b>Option/Alt+C</b> toggle chat, <b>Option/Alt+R</b> flip side, <b>Option/Alt+V</b> settings, <b>Esc</b> close settings, <b>Enter</b> type a message.</p>

  <script src="popup.js"></script>
</body>
</html>
